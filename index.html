<title>CAVOK · Meteo Aeronáutica v7</title>
<meta name="description" content="Condiciones meteorológicas en tiempo real de aeropuertos argentinos (METAR)">

<style>
/* ============ TOKENS ============ */
:root{
  --amarillo:#F5B941;          /* señalética de rodaje */
  --vfr:#3FC97E; --mvfr:#EBB748; --ifr:#EF6363; --lifr:#EF6363;
  --radio:12px;
  --f-display:'Saira Condensed', sans-serif;
  --f-body:'Barlow', system-ui, sans-serif;
  --f-mono:'JetBrains Mono', monospace;
}
[data-tema="oscuro"]{
  --bg:#0C1220; --panel:#141C2E; --panel2:#1B2540;
  --texto:#E9EEF7; --muted:#8A96AC; --linea:#26304A;
  --placa-bg:#05070D; --placa-borde:#F5B941;
  --sombra:0 6px 18px rgba(0,0,0,.35);
}
[data-tema="claro"]{
  --bg:#EDF0F5; --panel:#FFFFFF; --panel2:#F2F4F9;
  --texto:#1A2233; --muted:#5B6678; --linea:#D7DCE6;
  --placa-bg:#10141F; --placa-borde:#E2A82B;
  --sombra:0 4px 14px rgba(20,30,60,.12);
}

/* ============ BASE ============ */
*{box-sizing:border-box; margin:0; padding:0}
body{
  background:var(--bg); color:var(--texto);
  font-family:var(--f-body); font-size:17px; line-height:1.45;
  min-height:100vh; transition:background .25s, color .25s;
}
button{font-family:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--amarillo); outline-offset:2px}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }

/* ============ HEADER ============ */
header{
  display:flex; align-items:center; gap:14px;
  padding:18px 22px; border-bottom:1px solid var(--linea);
}
.logo-old-unused{
  font-family:var(--f-mono); font-weight:600; font-size:23px; letter-spacing:2px;
  background:var(--placa-bg); color:var(--amarillo);
  border:2px solid var(--placa-borde); border-radius:6px; padding:4px 12px;
}
.logo-tag{height:72px; width:auto; display:block; flex:none}
.titulos h1{font-family:var(--f-display); font-weight:700; font-size:28px; letter-spacing:.5px; line-height:1.1}

.titulos p{color:var(--muted); font-size:14px}
header .acciones{margin-left:auto; display:flex; gap:8px; align-items:center}
.btn-tema{
  background:var(--panel); border:1px solid var(--linea); color:var(--texto);
  border-radius:8px; padding:7px 12px; font-size:16px;
}
.btn-tema:hover{border-color:var(--amarillo)}

/* ============ BUSCADOR ============ */
.buscador-zona{max-width:1100px; margin:26px auto 0; padding:0 22px}
.buscador{position:relative}
.buscador input{
  width:100%; padding:14px 16px; font-size:18px; font-family:var(--f-body);
  background:var(--panel); color:var(--texto);
  border:1px solid var(--linea); border-radius:var(--radio);
}
.buscador input::placeholder{color:var(--muted)}
.buscador input:focus{outline:2px solid var(--amarillo); outline-offset:0; border-color:transparent}
.sugerencias{
  position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:30;
  background:var(--panel); border:1px solid var(--linea); border-radius:var(--radio);
  box-shadow:var(--sombra); overflow:hidden; display:none;
}
.sugerencias.abierta{display:block}
.sugerencia{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:11px 14px; background:none; border:none; color:var(--texto); font-size:17px;
  border-bottom:1px solid var(--linea);
}
.sugerencia:last-child{border-bottom:none}
.sugerencia:hover, .sugerencia.activa{background:var(--panel2)}
.sugerencia .icao-mini{
  font-family:var(--f-mono); font-size:14px; font-weight:600; letter-spacing:1px;
  color:var(--amarillo); background:var(--placa-bg); border-radius:4px; padding:2px 7px;
  min-width:54px; text-align:center;
}
.sugerencia .origen{margin-left:auto; font-size:12.5px; color:var(--muted)}
.aviso-busqueda{padding:11px 14px; color:var(--muted); font-size:15.5px}

/* ============ HISTORIAL ============ */
.historial{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; align-items:center}
.chip{
  display:inline-flex; align-items:center;
  background:var(--panel); border:1px solid var(--linea); color:var(--muted);
  border-radius:99px; overflow:hidden;
}
.chip:hover{color:var(--texto); border-color:var(--amarillo)}
.chip-nombre{
  background:none; border:none; color:inherit; font-size:15px;
  padding:6px 4px 6px 14px;
}
.chip-x{
  background:none; border:none; color:inherit; font-size:13px;
  padding:6px 11px 6px 5px; opacity:.55;
}
.chip-x:hover{opacity:1; color:var(--ifr)}
.chip-limpiar{
  background:none; border:none; color:var(--muted); font-size:13px;
  text-decoration:underline; padding:6px 4px;
}
.chip-limpiar:hover{color:var(--texto)}

/* ============ ACCIONES DEL TABLERO ============ */
.tablero-acciones{
  grid-column:1/-1; display:flex; justify-content:flex-end;
}
.btn-quitar-todos{
  background:none; border:1px solid var(--linea); color:var(--muted);
  border-radius:8px; padding:6px 14px; font-size:14px;
}
.btn-quitar-todos:hover{color:var(--texto); border-color:var(--ifr)}

/* ============ TABLERO ============ */
.tablero{
  max-width:1100px; margin:24px auto 60px; padding:0 22px;
  display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:18px;
}
.vacio{
  grid-column:1/-1; text-align:center; color:var(--muted);
  padding:60px 20px; border:1px dashed var(--linea); border-radius:var(--radio);
}
.vacio b{color:var(--texto)}

/* ============ TARJETA ============ */
.tarjeta{
  background:var(--panel); border:1px solid var(--linea); border-radius:var(--radio);
  box-shadow:var(--sombra); overflow:hidden; display:flex; flex-direction:column;
}
.tarjeta-cab{display:flex; align-items:center; gap:12px; padding:14px 16px 10px}
.placa{
  font-family:var(--f-mono); font-weight:600; font-size:24px; letter-spacing:3px;
  background:var(--placa-bg); color:var(--amarillo);
  border:2px solid var(--placa-borde); border-radius:6px; padding:3px 10px 3px 13px;
}
.tarjeta-cab .ciudad{font-family:var(--f-display); font-weight:600; font-size:22px; line-height:1.15}
.tarjeta-cab .observado{font-size:13px; color:var(--muted)}
.tarjeta-cab .botones{margin-left:auto; display:flex; gap:4px}
.btn-ico{
  background:none; border:none; color:var(--muted); font-size:17px;
  padding:4px 6px; border-radius:6px;
}
.btn-ico:hover{color:var(--texto); background:var(--panel2)}

.banda{
  display:flex; align-items:center; gap:8px;
  margin:4px 16px 12px; padding:8px 12px; border-radius:8px;
  font-weight:600; font-size:16px; color:#fff;
}
.banda .punto{width:10px; height:10px; border-radius:50%; background:#fff; flex:none;
  animation:latido 2.4s ease-in-out infinite}
@keyframes latido{0%,100%{opacity:1}50%{opacity:.35}}

.metricas{
  display:grid; grid-template-columns:1fr 1fr; gap:1px;
  background:var(--linea); border-top:1px solid var(--linea);
}
.metrica{background:var(--panel); padding:10px 16px}
.metrica .et{font-size:12.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted)}
.metrica .val{font-family:var(--f-mono); font-size:18px; margin-top:2px}
.metrica.ancha{grid-column:1/-1}

.tarjeta details{border-top:1px solid var(--linea); padding:9px 16px; font-size:14px; color:var(--muted)}
.tarjeta summary{cursor:pointer; user-select:none}

/* --- diagrama de pistas --- */
.pistas-svg{display:block; margin:10px auto 4px; max-width:300px; width:100%}
.pistas-svg .pista{stroke:var(--texto); stroke-linecap:butt; opacity:.85}
.pistas-svg .eje{stroke:var(--amarillo); stroke-width:1; stroke-dasharray:6 5; opacity:.9}
.pistas-svg .desig{font-family:var(--f-mono); font-size:11px; font-weight:600; fill:var(--amarillo)}
.pistas-svg .brujula{fill:none; stroke:var(--muted); stroke-width:1}
.pistas-svg .norte{font-family:var(--f-mono); font-size:10px; fill:var(--muted)}
.pistas-svg .viento{stroke:var(--vfr); stroke-width:2; fill:var(--vfr)}
.pistas-svg .viento-txt{font-family:var(--f-mono); font-size:9.5px; fill:var(--muted)}
.pistas-lista{font-family:var(--f-mono); font-size:12px; color:var(--texto); padding:2px 0 6px}
.pistas-lista div{padding:2px 0}
.pistas-fuente{font-size:10.5px; color:var(--muted)}
.tarjeta code{
  display:block; margin-top:7px; font-family:var(--f-mono); font-size:13px;
  word-break:break-all; color:var(--texto); background:var(--panel2);
  padding:8px 10px; border-radius:6px;
}
.tarjeta-error{padding:18px 16px; color:var(--muted); font-size:16px}
.tarjeta-error button{
  margin-top:10px; background:var(--panel2); border:1px solid var(--linea);
  color:var(--texto); border-radius:8px; padding:6px 12px;
}
.cargando{padding:26px 16px; color:var(--muted); font-family:var(--f-mono); font-size:15px}

footer{
  text-align:center; color:var(--muted); font-size:14px; padding:18px 0 28px;
  border-top:1px solid var(--linea);
}
footer b{color:var(--texto)}

@media (max-width:560px){
  header{padding:14px 16px}
  .logo-tag{height:72px; width:auto; display:block; flex:none}
.titulos h1{font-size:23px}
  .logo-old-unused{font-size:18px; letter-spacing:1px}
  .buscador-zona, .tablero{padding:0 14px}
}
</style>

/* ---------- Semáforo flight_category ---------- */
const CAT_COLOR = { VFR:'var(--vfr)', MVFR:'var(--mvfr)', IFR:'var(--ifr)', LIFR:'var(--lifr)' };
const CAT_LABEL = {
  VFR :'VFR · Condiciones visuales',
  MVFR:'MVFR · VFR marginal',
  IFR :'IFR · Vuelo por instrumentos',
  LIFR:'LIFR · Condiciones muy bajas'
};
const CLOUD_TEXT = { SKC:'Despejado', CLR:'Despejado', NSC:'Sin nubes significativas', NCD:'Sin nubes detectadas',
                     FEW:'Pocas nubes', SCT:'Nubes dispersas', BKN:'Mayormente nublado', OVC:'Cubierto',
                     VV:'Cielo invisible' };

/* ---------- Estado ---------- */
let tablero   = leerLS('tablero', []);     // [{icao, ciudad}]
let historial = leerLS('historial', []);   // [{icao, ciudad}]
let sugActiva = -1;

/* ---------- Utilidades ---------- */
function leerLS(clave, def){
  try { return JSON.parse(localStorage.getItem(PREFIJO + clave)) ?? def; }
  catch(e){ return def; }
}
function guardarLS(clave, val){
  try { localStorage.setItem(PREFIJO + clave, JSON.stringify(val)); } catch(e){}
}
function norm(s){
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function claveCacheHora(icao){
  const a = new Date();
  return `metar_${icao}_${a.getFullYear()}-${String(a.getMonth()+1).padStart(2,'0')}-${String(a.getDate()).padStart(2,'0')}T${String(a.getHours()).padStart(2,'0')}`;
}
function haceCuanto(iso){
  if (!iso) return '';
  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (isNaN(min) || min < 0) return '';
  if (min < 1)  return 'recién';
  if (min < 60) return `hace ${min} min`;
  const h = Math.floor(min / 60);
  return `hace ${h} h ${min % 60} min`;
}

/* =====================================================
   API — METAR (módulo probado, con caché por hora)
===================================================== */
async function loadMetar(icao, forzar = false){
  const cacheKey = claveCacheHora(icao);
  if (forzar) sessionStorage.removeItem(cacheKey);
  const cached = sessionStorage.getItem(cacheKey);
  if (cached) return JSON.parse(cached);

  try {
    const res = await fetch(`${API_BASE}/metar/${icao}/decoded`, {
      headers: { 'X-API-Key': API_KEY }
    });
    if (!res.ok) return null;
    const json = await res.json();
    const data = json?.data?.[0];
    if (!data) return null;
    try { sessionStorage.setItem(cacheKey, JSON.stringify(data)); } catch(e){}
    return data;
  } catch (e) {
    return null;
  }
}

/* API — búsqueda de estaciones (fallback ciudad→ICAO) */
async function buscarEstacionesAPI(texto){
  try {
    const res = await fetch(`${API_BASE}/station/search/${encodeURIComponent(texto)}`, {
      headers: { 'X-API-Key': API_KEY }
    });
    if (!res.ok) return [];
    const json = await res.json();
    return (json?.data || [])
      .filter(e => e.icao)
      .slice(0, 6)
      .map(e => ({
        icao: e.icao,
        ciudad: [e.city || e.name, e.country?.name].filter(Boolean).join(', ')
      }));
  } catch(e) {
    return [];
  }
}

/* =====================================================
   BUSCADOR + SUGERENCIAS
===================================================== */
const $input = document.getElementById('inputCiudad');
const $sug   = document.getElementById('sugerencias');
let timerAPI = null;

function buscarLocal(q){
  const n = norm(q);
  if (!n) return [];
  return AEROPUERTOS.filter(a =>
    norm(a.ciudad).includes(n) ||
    a.icao.toLowerCase().includes(n) ||
    a.alias.some(al => norm(al).includes(n))
  ).slice(0, 8);
}

function pintarSugerencias(items, origen){
  sugActiva = -1;
  if (!items.length){
    $sug.innerHTML = origen === 'api'
      ? '<div class="aviso-busqueda">Sin resultados. Probá con otro nombre o un código ICAO.</div>'
      : '<div class="aviso-busqueda">No está en la tabla local… buscando en CheckWX ⏳</div>';
    $sug.classList.add('abierta');
    return;
  }
  $sug.innerHTML = items.map((a, i) => `
    <button class="sugerencia" role="option" data-i="${i}" data-icao="${esc(a.icao)}" data-ciudad="${esc(a.ciudad)}">
      <span class="icao-mini">${esc(a.icao)}</span>
      <span>${esc(a.ciudad)}</span>
      ${origen === 'api' ? '<span class="origen">CheckWX</span>' : ''}
    </button>`).join('');
  $sug.classList.add('abierta');
  $sug.querySelectorAll('.sugerencia').forEach(btn => {
    btn.addEventListener('click', () =>
      agregarTarjeta(btn.dataset.icao, btn.dataset.ciudad));
  });
}

function cerrarSugerencias(){
  $sug.classList.remove('abierta');
  $sug.innerHTML = '';
  sugActiva = -1;
}

$input.addEventListener('input', () => {
  clearTimeout(timerAPI);
  const q = $input.value;
  if (norm(q).length < 2){ cerrarSugerencias(); return; }

  const locales = buscarLocal(q);
  if (locales.length){
    pintarSugerencias(locales, 'local');
  } else {
    pintarSugerencias([], 'local');           // aviso "buscando…"
    timerAPI = setTimeout(async () => {
      const remotos = await buscarEstacionesAPI(q);
      if (norm($input.value) === norm(q))      // sigue siendo la misma búsqueda
        pintarSugerencias(remotos, 'api');
    }, 500);
  }
});

$input.addEventListener('keydown', e => {
  const items = [...$sug.querySelectorAll('.sugerencia')];
  if (!items.length){
    if (e.key === 'Escape') cerrarSugerencias();
    return;
  }
  if (e.key === 'ArrowDown'){ e.preventDefault(); sugActiva = (sugActiva + 1) % items.length; }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); sugActiva = (sugActiva - 1 + items.length) % items.length; }
  else if (e.key === 'Enter'){
    e.preventDefault();
    const sel = items[sugActiva >= 0 ? sugActiva : 0];
    agregarTarjeta(sel.dataset.icao, sel.dataset.ciudad);
    return;
  }
  else if (e.key === 'Escape'){ cerrarSugerencias(); return; }
  else return;
  items.forEach((b, i) => b.classList.toggle('activa', i === sugActiva));
});

document.addEventListener('click', e => {
  if (!e.target.closest('.buscador')) cerrarSugerencias();
});

  historial = [];
  guardarLS('historial', historial);
  pintarHistorial();

function registrarHistorial(icao, ciudad){
  historial = [{icao, ciudad}, ...historial.filter(h => h.icao !== icao)].slice(0, 8);

  pintarHistorial();
}

  pintarTablero();

async function cargarTarjeta(icao, forzar = false){
  const $cuerpo = document.getElementById(`cuerpo-${icao}`);
  const $obs    = document.getElementById(`obs-${icao}`);
  if (!$cuerpo) return;
  $cuerpo.className = 'cargando';
  $cuerpo.textContent = 'Consultando METAR…';

  const data = await loadMetar(icao, forzar);
  if (!document.getElementById(`cuerpo-${icao}`)) return;   // tarjeta quitada mientras cargaba

  if (!data){
    $cuerpo.className = 'tarjeta-error';
    $cuerpo.innerHTML = `Sin datos METAR disponibles para <b>${esc(icao)}</b>.<br>
      La estación puede no reportar en este horario.
      <br><button onclick="refrescar('${esc(icao)}')">Reintentar</button>`;
    if ($obs) $obs.textContent = '';
    return;
  }

  /* --- métricas --- */
  const temp = data.temperature?.celsius != null ? `${data.temperature.celsius}°C` : '—';
  const hum  = data.humidity?.percent   != null ? `${data.humidity.percent}%`     : '—';

  let viento = '—';
  if (data.wind){
    const vel = data.wind.speed_kts != null ? `${data.wind.speed_kts} kt` : '';
    const dir = data.wind.direction || (data.wind.degrees != null ? `${data.wind.degrees}°` : '');
    viento = [vel, dir].filter(Boolean).join(' · ') || '—';
  } else if (data.raw_text && data.raw_text.includes('00000KT')){
    viento = 'Calmo';
  }

  let vis = '—';
  if (data.visibility?.meters != null){
    const m = parseFloat(String(data.visibility.meters).replace(/[^\d.]/g, ''));
    if (!isNaN(m)) vis = m >= 9999 ? '+10 km' : `${(m/1000).toLocaleString('es-AR',{maximumFractionDigits:1})} km`;
  }

  let nubes = '—';
  if (data.clouds?.length){
    nubes = data.clouds.map(c => {
      const txt = CLOUD_TEXT[c.code] || c.text || c.code;
      return c.base_feet_agl ? `${txt} (${c.base_feet_agl.toLocaleString('es-AR')} ft)` : txt;
    }).join(' · ');
  }

  const presion = data.barometer?.hpa != null ? `${data.barometer.hpa} hPa` : '—';

  const cat   = data.flight_category || '—';
  const color = CAT_COLOR[cat] || 'var(--muted)';
  const label = CAT_LABEL[cat] || cat;

  $cuerpo.className = '';
  $cuerpo.innerHTML = `
    <div class="banda" style="background:${color}">
      <span class="punto"></span> ${esc(label)}
    </div>
    <div class="metricas">
      <div class="metrica"><div class="et">🌡 Temperatura</div><div class="val">${esc(temp)}</div></div>
      <div class="metrica"><div class="et">💧 Humedad</div><div class="val">${esc(hum)}</div></div>
      <div class="metrica"><div class="et">💨 Viento</div><div class="val">${esc(viento)}</div></div>
      <div class="metrica"><div class="et">👁 Visibilidad</div><div class="val">${esc(vis)}</div></div>
      <div class="metrica ancha"><div class="et">☁️ Nubes</div><div class="val">${esc(nubes)}</div></div>
      <div class="metrica ancha"><div class="et">🔵 Presión</div><div class="val">${esc(presion)}</div></div>
    </div>
    ${renderPistas(icao, data)}
    <details>
      <summary>METAR crudo</summary>
      <code>${esc(data.raw_text || '—')}</code>
    </details>`;

  if ($obs) $obs.textContent = data.observed
    ? `Reporte ${haceCuanto(data.observed)}`
    : '';
}

function refrescar(icao){ cargarTarjeta(icao, true); }

/* =====================================================
   DIAGRAMA DE PISTAS (datos: OurAirports, dominio público)
===================================================== */
const SUPERFICIES = { ASP:'Asfalto', ASPH:'Asfalto', PEM:'Asfalto', BIT:'Asfalto',
                      CON:'Hormigón', CONC:'Hormigón', PAVED:'Pavimento',
                      GRS:'Césped', GRASS:'Césped', TURF:'Césped',
                      GRE:'Ripio', GRV:'Ripio', GRAVEL:'Ripio',
                      DIRT:'Tierra', SAND:'Arena', WATER:'Agua', UNK:'—' };

function textoSuperficie(sup){
  if (!sup) return '—';
  const clave = sup.split('-')[0].split('/')[0];
  return SUPERFICIES[clave] || sup;
}

function renderPistas(icao, metar){
  if (typeof PISTAS === 'undefined') return '';
  const pistas = PISTAS[icao];
  if (!pistas || !pistas.length) return '';

  const W = 300, H = 210, PAD = 42;
  let segs;   // [{x1,y1,x2,y2,p}]

  if (pistas.every(p => p.le && p.he)){
    /* Proyección equirectangular local → posiciones reales relativas */
    const lats = [], lons = [];
    pistas.forEach(p => { lats.push(p.le[0], p.he[0]); lons.push(p.le[1], p.he[1]); });
    const lat0 = (Math.min(...lats) + Math.max(...lats)) / 2;
    const k = Math.cos(lat0 * Math.PI / 180);
    const pts = pistas.map(p => ({
      x1: p.le[1] * k, y1: -p.le[0], x2: p.he[1] * k, y2: -p.he[0], p
    }));
    const xs = [], ys = [];
    pts.forEach(q => { xs.push(q.x1, q.x2); ys.push(q.y1, q.y2); });
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
    const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) || 1e-9;
    const escala = (Math.min(W, H) - 2 * PAD) / span;
    segs = pts.map(q => ({
      x1: W/2 + (q.x1 - cx) * escala, y1: H/2 + (q.y1 - cy) * escala,
      x2: W/2 + (q.x2 - cx) * escala, y2: H/2 + (q.y2 - cy) * escala, p: q.p
    }));
  } else {
    /* Sin coordenadas: dibujar por rumbo, largos relativos */
    const maxM = Math.max(...pistas.map(p => p.m || 1000));
    segs = pistas.map((p, i) => {
      const L = ((p.m || 1000) / maxM) * (Math.min(W, H) - 2 * PAD);
      const a = (p.hdg ?? 0) * Math.PI / 180;
      const dx = Math.sin(a), dy = -Math.cos(a);
      const ox = (i - (pistas.length - 1) / 2) * 18;   // separar paralelas
      return { x1: W/2 - dx*L/2 + ox, y1: H/2 - dy*L/2,
               x2: W/2 + dx*L/2 + ox, y2: H/2 + dy*L/2, p };
    });
  }

  /* Pistas + designadores */
  let svg = '';
  segs.forEach(s => {
    const ancho = Math.max(4, Math.min(9, (s.p.ancho || 30) / 8));
    svg += `<line class="pista" x1="${s.x1.toFixed(1)}" y1="${s.y1.toFixed(1)}" x2="${s.x2.toFixed(1)}" y2="${s.y2.toFixed(1)}" stroke-width="${ancho.toFixed(1)}"/>`;
    svg += `<line class="eje" x1="${s.x1.toFixed(1)}" y1="${s.y1.toFixed(1)}" x2="${s.x2.toFixed(1)}" y2="${s.y2.toFixed(1)}"/>`;
    const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    svg += `<text class="desig" x="${(s.x1 - ux*13).toFixed(1)}" y="${(s.y1 - uy*13).toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${esc(s.p.ids[0])}</text>`;
    svg += `<text class="desig" x="${(s.x2 + ux*13).toFixed(1)}" y="${(s.y2 + uy*13).toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${esc(s.p.ids[1])}</text>`;
  });

  /* Brújula (Norte arriba) */
  svg += `<g class="brujula-g">
    <circle class="brujula" cx="22" cy="24" r="13"/>
    <line x1="22" y1="33" x2="22" y2="17" stroke="var(--muted)" stroke-width="1.5"/>
    <path d="M 22 13 L 18.5 20 L 25.5 20 Z" fill="var(--muted)"/>
    <text class="norte" x="22" y="49" text-anchor="middle">N</text>
  </g>`;

  /* Flecha de viento desde el METAR (dirección verdadera, como las pistas) */
  if (metar?.wind?.degrees != null){
    const deg = metar.wind.degrees;
    const kt  = metar.wind.speed_kts;
    svg += `<g transform="translate(${W-26},26)">
      <g class="viento" transform="rotate(${deg})">
        <line x1="0" y1="-13" x2="0" y2="11"/>
        <path d="M 0 15 L -4.5 7 L 4.5 7 Z"/>
      </g>
      <text class="viento-txt" x="0" y="34" text-anchor="middle">${deg}°${kt != null ? ' · ' + kt + ' kt' : ''}</text>
    </g>`;
  }

  /* Lista con dimensiones */
  const lista = pistas.map(p => {
    const dim = p.m ? `${p.m.toLocaleString('es-AR')} m${p.ancho ? ' × ' + p.ancho + ' m' : ''}` : 's/d';
    return `<div>${esc(p.ids.join('/'))} · ${dim} · ${esc(textoSuperficie(p.sup))}</div>`;
  }).join('');

  return `
    <details class="pistas">
      <summary>🛬 Pistas (${pistas.length})</summary>
      <svg class="pistas-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-label="Diagrama de pistas de ${esc(icao)}">${svg}</svg>
      <div class="pistas-lista">${lista}</div>
      <div class="pistas-fuente">Norte arriba · flecha = viento actual · datos OurAirports</div>
    </details>`;
}

$btnTema.addEventListener('click', () =>
  aplicarTema(document.documentElement.dataset.tema === 'oscuro' ? 'claro' : 'oscuro'));

/* =====================================================
   INICIO + AUTO-REFRESCO
===================================================== */
aplicarTema(leerLS('tema', 'oscuro'));
pintarHistorial();
pintarTablero();
setInterval(() => tablero.forEach(t => cargarTarjeta(t.icao)), REFRESCO_MIN * 60 * 1000);
</script>
